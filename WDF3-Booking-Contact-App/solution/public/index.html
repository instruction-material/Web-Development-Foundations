<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local contact lab</title>
    <link href="/styles.css" rel="stylesheet" />
</head>
<body>
    <main>
        <h1>Local contact lab</h1>
        <form id="contact-form">
            <label for="name">Fictional name</label>
            <input id="name" name="name" required minlength="2" maxlength="80" autocomplete="off" />
            <label for="replyTo">Fictional reply address</label>
            <input id="replyTo" name="replyTo" type="email" required maxlength="254" placeholder="reader@example.invalid" autocomplete="off" />
            <label for="topic">Topic</label>
            <select id="topic" name="topic" required>
                <option value="">Choose a topic</option>
                <option value="project">Project</option>
                <option value="lesson">Lesson</option>
            </select>
            <label for="message">Message</label>
            <textarea id="message" name="message" required minlength="10" maxlength="2000"></textarea>
            <div class="actions">
                <button type="submit">Submit locally</button>
                <button type="reset">Reset</button>
            </div>
        </form>
        <p id="status" role="status" aria-live="polite" tabindex="-1"></p>
    </main>
    <script src="/app.js" type="module"></script>
</body>
</html>
