<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Local Notes</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="shell"><h1>Local Notes</h1>
<form id="note-form">
<label for="title">Title</label><input id="title" name="title" required maxlength="120">
<label for="body">Body</label><textarea id="body" name="body" required maxlength="2000"></textarea>
<label for="tags">Tags (JSON array)</label><input id="tags" name="tags" placeholder='["example", "sky"]'>
<div><button type="submit">Create note</button><button id="cancel" type="button" hidden>Cancel edit</button></div>
</form><p id="status" role="status" aria-live="polite"></p><h2>Saved notes</h2><ul id="notes"></ul>
</main><script src="/app.js" type="module"></script></body>
</html>
