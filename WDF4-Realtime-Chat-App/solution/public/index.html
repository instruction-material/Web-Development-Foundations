<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Realtime Chat Solution</title>
        <link href="/styles.css" rel="stylesheet" />
        <style>
            input {
                min-width: 0;
                max-width: 100%;
                box-sizing: border-box;
            }
            #messages {
                overflow-wrap: anywhere;
                max-height: 18rem;
                overflow-y: auto;
            }
            button:disabled {
                opacity: 0.55;
                cursor: default;
            }
        </style>
    </head>
    <body>
        <main class="shell">
            <section class="panel">
                <h1>Realtime Chat</h1>
                <p id="connection-status" role="status">Connecting</p>
                <button id="reconnect" type="button">Reconnect</button>
                <p id="chat-error" role="status"></p>
                <form class="row" id="identity-form">
                    <label for="nickname">Nickname</label
                    ><input
                        id="nickname"
                        placeholder="Nickname"
                        maxlength="32"
                        required
                    />
                    <button type="submit">Join</button>
                </form>
                <ul
                    class="messages"
                    id="messages"
                    role="log"
                    aria-label="Messages"
                    aria-live="polite"
                    aria-relevant="additions"
                ></ul>
                <form class="row" id="chat-form">
                    <label for="message">Message</label
                    ><input
                        id="message"
                        maxlength="280"
                        placeholder="Type a message"
                        required
                    />
                    <button type="submit">Send</button>
                </form>
            </section>
        </main>
        <script src="/socket.io/socket.io.js"></script>
        <script src="/chat.js" type="module"></script>
    </body>
</html>
