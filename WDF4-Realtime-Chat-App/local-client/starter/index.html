<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Notification State Lab</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <main>
            <h1>Notifications</h1>
            <nav aria-label="Notification views">
                <a href="#all">All</a>
                <a href="#messages">Messages</a>
                <a href="#status">Status</a>
            </nav>
            <label for="fixture">Data set</label>
            <select id="fixture">
                <option value="events">Workshop</option>
                <option value="empty">Empty</option>
                <option value="invalid">Invalid structure</option>
                <option value="malformed">Malformed JSON</option>
                <option value="history">History limit</option>
                <option value="out-of-order">Delayed events</option>
            </select>
            <div class="actions">
                <button id="load" type="button">Load notifications</button>
                <button id="disconnect" type="button">Disconnect</button>
                <button id="reconnect" type="button">Reconnect</button>
                <button id="reset" type="button">Reset</button>
            </div>
            <p id="load-status" role="status" aria-atomic="true">Ready</p>
            <p id="counts" hidden></p>
            <p id="empty-view" hidden>No notifications in this view.</p>
            <ul id="items" aria-label="Notifications"></ul>
        </main>
        <script type="module" src="app.mjs"></script>
    </body>
</html>
